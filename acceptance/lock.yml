# The one firmware the robot carries, commit for commit. `rake acceptance:deploy`
# pins every tree below, builds from this checkout (its HEAD is recorded in the
# report and its tracked files must be clean), flashes the firmware (the only
# firmware write of a report) and then sends `app` to /home/app.mrb; `rake
# acceptance:app` re-sends only the app. `rake acceptance:check` reads the flash back,
# boots the board and drives it from the Mac any number of times without
# writing flash. Every sha is checked out before it is used and checked again
# after the build; a mismatch stops the run. Change a line here to try
# something else.
firmware:
  R2P2-ESP32: 97166052a334fcc959bcdf6fe7da4c35792f80a6           # claude/external-build-config
  picoruby: 9c4636a48c4b712f6f0e55bb8dfe90aac1bdddba             # claude/ble-peripheral-disconnect
  repos:                                                         # build/repos/esp32-picoruby/<name>
    picoruby-ili9342: 6adc482994ce420c491c442bd0a3c2c8834a6296    # claude/aot-glyph16
    picoruby-py32-io-expander: 8f8b3d3d9aab03ca4dac2b78004b36a0459366c9   # claude/simplify
    picoruby-scservo: 1e3a18b19ecf1d23e33a455278d691690af2acb8   # claude/simplify
  aot:                                                           # build/aot/<name>
    suppify: a5449a394c6d6ef31afebdbabd56be563208a83e            # claude/string-arg-length
    spinel: 4a28d45f01fef4605eedca6d7008771d51306e07
    picoruby-multicore: 83bd0d6203ebd707e46e0b7779f1c844ecca0187
  app: apps/robot/app.rb
  boot_markers:
    - "[application] boot"
    - "[boot] step:led-init-ok"
    - "[application] BLE peripheral starting"

# The Apple platform. pc:vm_build builds the Mac VM from it, and `rake
# acceptance:darwin` builds apps/ios and apps/watchos from this checkout with it,
# runs each app in trial mode against the deployed firmware, and hands the
# robot Mac → iPhone → Watch → Mac.
darwin:
  R2P2-darwin: 7a0221967f70bd93114a3ccd5c4f7248e3bbd7c2             # claude/external-app
  picoruby: 97479c96a4f9bd4f2b08540807bb792cd4ef8d18                # port-darwin, vendor/R2P2-darwin/vendor/picoruby
