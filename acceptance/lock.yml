# The one firmware the robot carries, commit for commit. `rake acceptance:deploy`
# pins every tree below, builds from this checkout (its HEAD is recorded in the
# report and its tracked files must be clean), flashes the firmware (the only
# firmware write of a report) and then sends `app` to /home/app.mrb; `rake
# acceptance:app` re-sends only the app. `rake acceptance:check` reads the flash back,
# boots the board and drives it from the Mac any number of times without
# writing flash. Every sha is checked out before it is used and checked again
# after the build; a mismatch stops the run. Change a line here to try
# something else.
firmware:
  R2P2-ESP32: 93505440c8e0fb84fe3314d3591e55042caad406           # claude/latest-deps
  picoruby: 57242b8c243379c0200e219e4ae0a03c92c7ab63             # claude/latest-deps-firmware
  repos:                                                         # build/repos/esp32-picoruby/<name>
    picoruby-ili9342: 24931a4a2a78c4745f288e3991148bf4c0b9c3d7    # claude/latest-deps
    picoruby-py32-io-expander: 8f8b3d3d9aab03ca4dac2b78004b36a0459366c9   # main
    picoruby-scservo: 36281109f3051b510634c6ae3f3d521d197e9064   # main
  aot:                                                           # build/aot/<name>
    suppify: b890423bb8c7a829190251fb302f7bd3cb33b69a            # newlib-runtime-pr-pin
    spinel: b4396bfa05b6808cbe04f2a7fe47a4ada74012d7                 # newlib-runtime-pr (bash0C7/spinel)
    picoruby-multicore: 8b25e91b8a837cb7e6829da0838d6e169c621682     # claude/latest-deps
  app: apps/robot/app.rb
  boot_markers:
    - "[application] boot"
    - "[boot] step:led-init-ok"
    - "[application] BLE peripheral starting"

# The Apple platform. pc:vm_build builds the Mac VM from it, and `rake
# acceptance:darwin` builds apps/ios and apps/watchos for the device from this
# checkout with it, runs the iPhone app in batch mode against the deployed
# firmware, and hands the robot Mac → iPhone → Mac. That run is optional; the
# verdict does not need it.
darwin:
  R2P2-darwin: 382a7e8a55c114fe330acbc105778b30c3dd8189             # claude/latest-deps
  picoruby: 993121be4a5729101f4a620a11f1905767f1fa4a                # claude/latest-deps-darwin, vendor/R2P2-darwin/vendor/picoruby
