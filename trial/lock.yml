# What `rake trial:run` puts on the robot, commit for commit. Every sha is
# checked out before it is used and checked again after the build; a mismatch
# stops the run. Change a line here to trial something else.
#
# Each arm is one firmware + app on the CoreS3, built with that arm's own
# stackchan-picoruby tooling (a git worktree at `stackchan-picoruby` under
# build/trial/<arm>). The PC daemon and CLI come from the same worktree and run
# on one Mac VM, built once from the `darwin` pin before the arms.
arms:
  base:
    stackchan-picoruby: b850f37579aa2002c85ca0aa8a6102725e249ac7   # main
    R2P2-ESP32: 2f187201589b1fe43c11665aad85e3aabe4813b2           # c-primitives-verified
    picoruby: 7258676d6177dc4d8eb89fccec2fe0c6c0e4ef0b             # R2P2-ESP32's submodule
    repos:                                                         # build/repos/esp32-picoruby/<name>
      picoruby-ili9342: 01a1a025c2f3ce837efe373402e64754e3c12a9a    # main
      picoruby-py32-io-expander: 407b2c43fbeaace13239be8773d7a06aa3835baf
      picoruby-stackchan-protocol: 44000e576fce6d98396e68efa89017a42900eec9
      picoruby-scservo: 2f0ec4a1403adaaf3da1df13478b3562341c159f
      stackchan-picoruby: b850f37579aa2002c85ca0aa8a6102725e249ac7  # picoruby-aw88298 (C)
    boot_markers:
      - "[application] boot"
      - "[boot] step:led-init-ok"
      - "[application] BLE peripheral starting"
  trial:
    stackchan-picoruby: 0ba2e96170ea8639e1dc8a8175abf62618604d44   # claude/stackchan-robot-engine
    R2P2-ESP32: 850e9e8b009f17643fa1cc9cb16b4f684e69197f           # claude/stackchan-robot-engine
    picoruby: 9c4636a48c4b712f6f0e55bb8dfe90aac1bdddba             # claude/ble-peripheral-disconnect
    repos:
      picoruby-ili9342: 6adc482994ce420c491c442bd0a3c2c8834a6296    # claude/aot-glyph16
      picoruby-py32-io-expander: 8f8b3d3d9aab03ca4dac2b78004b36a0459366c9   # claude/simplify
      picoruby-scservo: 1e3a18b19ecf1d23e33a455278d691690af2acb8   # claude/simplify
    aot:                                                           # build/aot/<name> in the worktree
      suppify: a5449a394c6d6ef31afebdbabd56be563208a83e            # claude/string-arg-length
      spinel: 4a28d45f01fef4605eedca6d7008771d51306e07
      picoruby-multicore: 83bd0d6203ebd707e46e0b7779f1c844ecca0187
    boot_markers:
      - "[application] boot"
      - "[boot] step:led-init-ok"
      - "[application] BLE peripheral starting"
    remote: true
    stack_check: true
    controller: true
    app: apps/robot/app.rb

# iOS / watchOS apps, run against the trial arm's firmware.
darwin:
  R2P2-darwin: c0d5aff881b8e51d462483e8130fa3098be16bee             # claude/drb-over-ble
